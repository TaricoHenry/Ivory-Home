{%- comment -%}
  Line icons for detail cards. Usage: {% include invitation/icon.html name="calendar" %}
  Add a new icon by adding a `when` branch with a 24x24 stroke SVG body.
{%- endcomment -%}
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- case include.name -%}
  {%- when 'calendar' -%}<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9h17M8 13h2M14 13h2M8 16.5h2"/>
  {%- when 'pin' -%}<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.25"/>
  {%- when 'shirt' -%}<path d="m8 4 4 2 4-2 4 2 2 4-4 2v8H6v-8l-4-2 2-4 4-2Z"/><path d="M8 4c0 2 1.8 3.5 4 3.5S16 6 16 4M6 12h3m6 0h3"/>
  {%- when 'clock' -%}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  {%- when 'gift' -%}<rect x="3.5" y="8.5" width="17" height="4" rx="1"/><path d="M5 12.5v8h14v-8M12 8.5v12M12 8.5S10.5 4 8 4.5 7 8.5 12 8.5ZM12 8.5S13.5 4 16 4.5s1 4-4 4Z"/>

  {%- else -%}<circle cx="12" cy="12" r="3"/>
{%- endcase -%}
</svg>
