title: Ivory
description: Digital invitations and event experiences for every occasion.
domain: taricohenry.github.io
url: https://taricohenry.github.io
baseurl: /

host: 0.0.0.0
port: 3000

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - assets/css/input.css
  - README.md
  - assets/css/invitation-input.css
  - scripts
  - docs

# Invitation pages: /invitations/<slug>/ reads _data/invitations/<slug>.yml
# (set `invitation: <slug>` in the page's front matter).
defaults:
  - scope:
      path: "invitations"
    values:
      layout: invitation
