# ==========================================================================
#  Ivory Invite Virtual Meeting — public demo / booking page
#  Validate with:  ruby scripts/check_event.rb
# ==========================================================================

# --- Identity -------------------------------------------------------------
id: ivory-virtual-meeting
type: corporate
name: Ivory Invite Virtual Meeting
host:
  name: Ivory Invites
  short_name: IVORY
  logo: ivory-logo_black.svg      # shown on the thank-you page
  nav_logo: ivory-logo_black.svg  # top-left, on the white bar

# --- Site / sharing -------------------------------------------------------
site:
  url: https://ivory-gy.com       # site origin; used for the share image
  description: Book a one-hour virtual walkthrough of Ivory digital invitations.
  favicon: ivory-logo_black.svg
  lang: en

# --- When -----------------------------------------------------------------
datetime: 2026-11-17T10:00:00-04:00   # first slot; only used if countdown is turned on

# --- Look: gold and white --------------------------------------------------
theme:
  colors:
    ink: "#2b2416"            # warm near-black text
    paper: "#ffffff"          # white page
    muted: "#7d7460"
    line: "#ece3cf"
    field: "#d8c79c"          # gold-tinted input borders
    primary: "#b8912f"        # Ivory gold: buttons, selected states
    primary-deep: "#8a6a1e"   # deep gold: footer, hero shading
    hero: "#c9a646"           # gold hero background (no photo)
    accent: "#a27f24"         # labels, icons, focus rings
    highlight: "#f1dc9a"
    highlight-soft: "#f6e7b8" # submit button
    on-dark: "#ffffff"        # white text on gold
  fonts:
    sans: '"Avenir Next", Avenir, "Segoe UI", sans-serif'
    display: '"Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif'

# --- Features -------------------------------------------------------------
features:
  rsvp: form            # custom fields below
  contributions: false
  gallery: false
  countdown: false
  ivory_credit: false   # it's Ivory's own page

sections:
  - hero
  - invitation
  - footer

# --- Section copy ---------------------------------------------------------
hero:
  align: center
  nav_bar: light                  # white bar across the top
  height: full                    # fill the whole screen (leave out for the usual 810px cap)
  background: gold                # plain gold gradient, no photos (.hero-gold in invitation-input.css)
  texture:                        # repeating pattern blended into the gold
    image: black-flower-background-1800.jpg   # web-sized copy of black-flower-background.png
    size: 900                     # width of one tile in px (60% of this on phones)
    opacity: 0.4                  # 0 = invisible, 1 = full strength
    blend: overlay                # overlay | soft-light | multiply
  circles:                        # gold circles that drift apart as you scroll (assets/js/invitation.js)
    # x / y: centre, as % of the hero. size: % of the screen's longer side.
    # style: solid (polished gold) | ring (thin outline) | dots (halftone).
    # speed: vertical travel per pixel scrolled (negative = up). drift: sideways (negative = left).
    # spin: degrees turned per 100px scrolled.
    - { x: 8,  y: 20, size: 9,   style: dots, speed: -0.45, drift: -0.18, spin: 6 }
    - { x: 22, y: 9,  size: 2.5, style: ring, speed: -0.95, drift: -0.35, spin: 0 }
    - { x: 31, y: 34, size: 4,   style: ring,  speed: -0.70, drift: -0.10, spin: 0 }
    - { x: 17, y: 52, size: 6,   style: dots,  speed: -0.55, drift: -0.40, spin: 14 }
    - { x: 4,  y: 72, size: 3,   style: ring, speed: -1.05, drift: -0.08, spin: 0 }
    - { x: 13, y: 88, size: 7,   style: ring,  speed: -0.35, drift: -0.22, spin: 0 }
    - { x: 33, y: 80, size: 2,   style: ring, speed: -1.25, drift: 0.12,  spin: 0 }
    - { x: 46, y: 95, size: 5,   style: dots,  speed: -0.80, drift: -0.05, spin: -10 }
    - { x: 52, y: 5,  size: 3.5, style: ring,  speed: -0.50, drift: 0.15,  spin: 0 }
    - { x: 67, y: 14, size: 2,   style: dots, speed: -1.15, drift: 0.30,  spin: 0 }
    - { x: 84, y: 12, size: 6.5, style: dots,  speed: -0.85, drift: 0.22,  spin: -12 }
    - { x: 94, y: 33, size: 3,   style: ring, speed: -0.60, drift: 0.45,  spin: 0 }
    - { x: 73, y: 46, size: 4.5, style: ring,  speed: -0.95, drift: 0.28,  spin: 0 }
    - { x: 89, y: 62, size: 10,  style: dots, speed: -0.30, drift: 0.12,  spin: 0 }
    - { x: 71, y: 82, size: 2.5, style: ring, speed: -1.30, drift: -0.12, spin: 0 }
    - { x: 82, y: 92, size: 5,   style: dots,  speed: -0.65, drift: 0.38,  spin: 9 }
    - { x: 97, y: 85, size: 3.5, style: ring,  speed: -0.75, drift: 0.05,  spin: 0 }
  logo: ivory-logo_white.svg      # shown above the title
  logo_alt: Ivory Invites
  title_html: Virtual Meeting
  subtitle_html: 'Online <span class="px-2" aria-hidden="true">·</span> Pick a time below'
  cta: Book a time

invitation:
  background:
    image: spotted-background-2000.jpg   # web-sized copy of spotted-background.jpg
    tint: true                           # dots turn Ivory gold
    opacity: 0.05                        # 0 = invisible, 1 = full strength
  eyebrow: You’re invited
  greeting_html: 'Hello <span class="text-accent italic" data-greeting-name data-fallback="there">there</span>!'   # "there" becomes the guest's first name as they type
  body: See what an Ivory invitation looks like from the guest’s side, then choose an hour that suits you.
  details:
    - icon: calendar
      label: When
      title_html: Schedule below
    - icon: pin
      label: Where
      title_html: Online
    - icon: shirt
      label: Dress code
      title_html: Whatever you like

rsvp:
  question: Book your meeting
  subtext: All times are Guyana time (GMT-4).
  fields:                       # each `name` becomes a key in the request body
    - name: name                # type: name shows first + last inputs, sent as one `name`
      label: Your name
      type: name
      greeting: true            # first name fills the "Hello there!" greeting
      required: true
    - name: email
      label: Email
      type: email
      autocomplete: email
      placeholder: you@example.com
      required: true
    - name: whatsapp
      label: WhatsApp number
      type: tel
      autocomplete: tel
      inputmode: tel
      placeholder: "+592 600 0000"
      required: true
    - name: timeslot
      label: Choose a time
      type: choice              # one button per slot; picking one deselects the rest
      required: true
      schedule:                 # slots are built in the browser from today's date
        days_ahead: 7           # tomorrow through a week from today
        utc_offset: "-04:00"    # Guyana time; also sent in each slot's value
        hours:                  # 24-hour "start-end"; a day left out has no slots
          weekdays: ["17:30-18:30", "18:30-19:30"]   # Mon–Fri
          sat: ["10:00-11:00", "13:00-14:00"]
        blocked:                # shown as "Booked" (display only, nothing is reserved)
          seed: ivory           # change this word to reshuffle which slots look taken
          near_percent: 50      # chance a slot tomorrow shows as booked
          far_percent: 15       # chance a slot on the last day shown is booked
          min_booked: 2         # always at least this many booked
          max_share: 0.5        # never more than this share of slots booked
  submit_label: Book my slot
  footnote: Submitting this lets us know you’re interested.

thank_you:
  title: You’re booked!
  subtitle: Check your email and WhatsApp.

# --- Backend --------------------------------------------------------------
# No database: each booking just sends one email to Ivory's inbox through the
# notifications service (POST {api_base}/v1/messages/email).
backend:
  notifications:
    api_base: https://ivory-notifications-prod.ivory-core-dev.workers.dev
    api_key: ivk_prod_6QFdEDhaUBgwyqJVnbHmNnKQ7Rig4uPI   # x-api-key — ships in the public page source

# The email each booking sends. Reply-To is the guest's email, so replying
# reaches them. {first_name} and any field name in braces ({name}, {email},
# {whatsapp}, {timeslot}) are filled in from the form.
notification_email:
  to: ivorygroup.gy@gmail.com
  from_name: Ivory Invites
  subject: "New demo booking: {name} — {timeslot}"
  preheader: "{name} booked a virtual walkthrough"
  heading: New demo booking
  body: "{name} booked a virtual walkthrough. Reply to this email to reach them."

# Confirmation sent to the address the guest entered, after the email above
# succeeds. Reply-To is the inbox above (or set reply_to here). Same {fields}.
# Delete this block to stop guest emails.
guest_email:
  from_name: Ivory Invites
  subject: "You’re booked: {timeslot}"
  preheader: Your Ivory virtual walkthrough is confirmed
  heading: Hi {first_name},
  body: Thanks for booking a virtual walkthrough of Ivory invitations. Here are your details — we’ll send the meeting link on WhatsApp before your slot. Need to change something? Just reply to this email.
  sign_off: The Ivory team
